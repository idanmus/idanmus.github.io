<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רשימת קניות</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg-dark:#121212;
  --bg-mid:#1e1e1e;
  --bg-light:#2a2a2a;
  --text:#ffffff;
  --muted:#b0b0b0;
  --highlight:#555;
}
body{
  margin:0;
  font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg-dark);
  color:var(--text);
  direction:rtl;
}
header{
  background:var(--bg-mid);
  padding:14px 16px;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}
header h1{
  margin:0;
  font-size:24px;
  font-weight:600;
  text-align:center;
}
header button{
  position:absolute;
  right:16px;
  background:none;
  border:none;
  color:white;
  font-size:24px;
  cursor:pointer;
}
.container{ display:flex; height:calc(100vh - 56px); }
.sidebar{
  width:0;
  background:var(--bg-mid);
  border-right:1px solid #333;
  overflow:hidden;
  transition:0.3s;
  flex-shrink:0;
}
.sidebar.open{ width:230px; }
.sidebar button{
  width:90%;
  margin:8px auto;
  padding:10px;
  background:var(--bg-light);
  border:none;
  border-radius:8px;
  color:white;
  font-size:15px;
  cursor:pointer;
}
.sidebar button:hover{ background:#333; }
.sidebar button.active{ background:var(--highlight); }
main{ flex:1; padding:20px; overflow-y:auto; }
#categoryTitle{ color:var(--muted); margin-bottom:12px; }
.box{ background:var(--bg-mid); padding:14px; border-radius:12px; margin-bottom:20px; }
input, select{
  background:var(--bg-light);
  border:1px solid #333;
  color:white;
  padding:10px;
  border-radius:8px;
  font-size:15px;
  width:100%;
}
.row{ display:flex; gap:10px; flex-wrap:wrap; }
.add-btn{ background:white; color:black; border:none; border-radius:8px; padding:10px 16px; cursor:pointer; font-weight:600; }
ul{ list-style:none; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
li{
  background:var(--bg-mid);
  border-radius:14px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}
li small{ color:var(--muted); }
li button{ background:none; border:none; color:#aaa; font-size:18px; cursor:pointer; }
.checkmark{ margin-right:6px; }
li.ירקות{ border-left:5px solid #4caf50; }
li.פירות{ border-left:5px solid #ff9800; }
li.בשר{ border-left:5px solid #f44336; }
li.חלב{ border-left:5px solid #2196f3; }
li.מאפים{ border-left:5px solid #ffeb3b; }
li.אחר{ border-left:5px solid #9e9e9e; }
li.נקנה{ border-left:5px solid #8bc34a; }
.hidden{ display:none; }
#history{ margin-top:20px; }
#history button{
  background:var(--bg-light);
  border:none;
  border-radius:8px;
  width:100%;
  padding:10px;
  margin-bottom:5px;
  color:white;
  cursor:pointer;
}
#history button:hover{ background:#555; }
</style>
</head>

<body>
<header>
  <button onclick="toggleSidebar()">☰</button>
  <h1>רשימת קניות</h1>
</header>

<div class="container">
  <div id="sidebar" class="sidebar">
    <button onclick="selectSidebarOption('add')">➕ הוסף פריט</button>
    <div id="categoryButtons"></div>
    <button onclick="selectSidebarOption('settings')">⚙️ הגדרות</button>
    <h3 style="color:#bbb;margin:10px;">רשימות קודמות:</h3>
    <div id="history"></div>
  </div>

  <main>
    <div id="addItemForm" class="box hidden">
      <div class="row">
        <input id="itemInput" placeholder="מה צריך לקנות?">
        <select id="categorySelect"></select>
        <select id="userSelect">
          <option>עידן</option>
          <option>עדן</option>
        </select>
        <button class="add-btn" onclick="addItem()">הוסף</button>
      </div>
    </div>

    <div id="settings" class="box hidden">
      <h3>קטגוריות</h3>
      <div class="row">
        <input id="newCategory" placeholder="שם קטגוריה">
        <button class="add-btn" onclick="addCategory()">הוסף</button>
      </div>
      <ul id="categoryList"></ul>
      <hr style="border-color:#333">
      <label>
        <input type="checkbox" id="autoClose"> סגור סיידבר אחרי לחיצה
      </label>
    </div>

    <div id="categoryTitle">קטגוריה: הכל</div>
    <ul id="list"></ul>
  </main>
</div>

<script>
/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyCBKTDiDa7xnWgEOhPFeReLQDJgr9d4g8E",
  authDomain: "shopping-list-cf3fd.firebaseapp.com",
  projectId: "shopping-list-cf3fd"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* STATE */
let LIST_ID = new Date().toISOString().split('T')[0];
let currentCategory = 'הכל';
let categories = [];

/* PREFS */
let autoClose = JSON.parse(localStorage.getItem('autoClose')) ?? true;
document.getElementById('autoClose').checked = autoClose;
document.getElementById('autoClose').onchange = e=>{
  autoClose = e.target.checked;
  localStorage.setItem('autoClose', autoClose);
};

/* ELEMENTS */
const sidebar = document.getElementById('sidebar');
const categoryButtons = document.getElementById('categoryButtons');
const categorySelect = document.getElementById('categorySelect');
const categoryList = document.getElementById('categoryList');
const categoryTitle = document.getElementById('categoryTitle');
const historyEl = document.getElementById('history');
const addItemForm = document.getElementById('addItemForm');
const settingsForm = document.getElementById('settings');
const listEl = document.getElementById('list');

/* SIDEBAR */
function toggleSidebar(){ sidebar.classList.toggle('open'); }

function selectSidebarOption(option){
  addItemForm.classList.add('hidden');
  settingsForm.classList.add('hidden');
  listEl.style.display = 'none';

  categoryButtons.querySelectorAll('button').forEach(btn=>btn.classList.remove('active'));

  if(option==='add') addItemForm.classList.remove('hidden');
  else if(option==='settings') settingsForm.classList.remove('hidden');
  else filterCategory(option);

  const btn = [...categoryButtons.children].find(b=>b.textContent===option);
  if(btn) btn.classList.add('active');

  if(autoClose) sidebar.classList.remove('open');
}

/* CATEGORIES SYNC */
const metaRef = () => db.collection('lists').doc(LIST_ID).collection('meta').doc('settings');

function initCategories(){
  metaRef().onSnapshot(doc=>{
    if(!doc.exists){
      metaRef().set({ categories:['הכל','אחר','נקנה'] });
      return;
    }
    categories = doc.data().categories;

    if(!categories.includes('נקנה')){
      metaRef().update({ categories: firebase.firestore.FieldValue.arrayUnion('נקנה') });
    }

    rebuildCategoriesUI();
  });
}

function rebuildCategoriesUI(){
  categoryButtons.innerHTML='';
  categorySelect.innerHTML='';
  categoryList.innerHTML='';

  categories.forEach(cat=>{
    categoryButtons.innerHTML += `<button onclick="selectSidebarOption('${cat}')">${cat}</button>`;
    if(cat!=='הכל' && cat!=='נקנה'){
      categorySelect.innerHTML += `<option>${cat}</option>`;
      categoryList.innerHTML += `<li>${cat} <button onclick="removeCategory('${cat}')">❌</button></li>`;
    }
    if(cat==='נקנה'){
      categoryList.innerHTML += `<li>${cat} (לא ניתן למחיקה)</li>`;
    }
  });

  if(!categorySelect.value && categorySelect.options.length>0){
    categorySelect.value = categorySelect.options[0].value;
  }
}

function addCategory(){
  const input = document.getElementById('newCategory');
  const name = input.value.trim();
  if(!name || categories.includes(name) || name==='נקנה') return;
  metaRef().update({ categories: firebase.firestore.FieldValue.arrayUnion(name) });
  input.value='';
}

function removeCategory(cat){
  if(cat==='הכל' || cat==='נקנה') return;
  metaRef().update({ categories: firebase.firestore.FieldValue.arrayRemove(cat) });
}

/* FILTER CATEGORY */
function filterCategory(cat){
  currentCategory = cat;
  categoryTitle.textContent = `קטגוריה: ${cat}`;
  listEl.style.display = 'block';
  loadList();
}

/* ITEMS SYNC */
function addItem(){
  const text = document.getElementById('itemInput').value.trim();
  if(!text) return;

  let cat = categorySelect.value || 'אחר';

  db.collection("lists").doc(LIST_ID).collection("items").add({
    text,
    category: cat,
    originalCategory: cat,
    user: document.getElementById('userSelect').value,
    done: false,
    createdAt: new Date()
  })
  .then(()=>{
    document.getElementById('itemInput').value='';
    addItemForm.classList.add('hidden');
    listEl.style.display = 'block';
  })
  .catch(err => alert("שגיאה בהוספת פריט: " + err));
}

/* LIST SYNC */
let unsubscribeList = null;

function loadList(){
  if(unsubscribeList) unsubscribeList();

  unsubscribeList = db.collection("lists").doc(LIST_ID).collection("items")
    .orderBy("createdAt")
    .onSnapshot(snapshot=>{
      let items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

      // מיון: קודם לפי קטגוריה, ואז לפי done
      items.sort((a,b)=>{
        if(a.category === 'נקנה' && b.category !== 'נקנה') return 1;
        if(b.category === 'נקנה' && a.category !== 'נקנה') return -1;
        if(a.done !== b.done) return a.done - b.done;
        return a.createdAt - b.createdAt;
      });

      listEl.innerHTML='';

      items.forEach(i=>{
        if(currentCategory!=='הכל' && i.category!==currentCategory) return;

        listEl.innerHTML += `
          <li class="${i.category}" onclick="toggleDone('${i.id}', ${i.done})">
            <span>
              ${i.text}
              ${i.done?'<span class="checkmark">✔️</span>':''}
              <br>
              <small>${i.category} · ${i.user}</small>
            </span>
            <button onclick="event.stopPropagation(); removeItem('${i.id}')">🗑</button>
          </li>`;
      });
    });
}

function removeItem(id){
  db.collection("lists").doc(LIST_ID).collection("items").doc(id).delete();
}

/* ✔️ NEW: move checked items to category "נקנה" but keep originalCategory */
function toggleDone(id, done){
  db.collection("lists").doc(LIST_ID).collection("items").doc(id).get().then(doc=>{
    const item = doc.data();
    const original = item.originalCategory;

    if(!done){
      db.collection("lists").doc(LIST_ID).collection("items").doc(id).update({
        done: true,
        category: "נקנה"
      });
    } else {
      db.collection("lists").doc(LIST_ID).collection("items").doc(id).update({
        done: false,
        category: original
      });
    }
  });
}

/* HISTORY */
function loadHistory(){
  db.collection("lists").get().then(snapshot=>{
    historyEl.innerHTML='';
    snapshot.docs.forEach(doc=>{
      const btn = document.createElement('button');
      btn.textContent = doc.id;
      btn.onclick = ()=>{
        LIST_ID = doc.id;
        loadList();
        initCategories();
      };
      historyEl.appendChild(btn);
    });
  });
}

/* INIT */
db.collection("lists").doc(LIST_ID).set({
  createdAt: new Date()
}, { merge: true });

initCategories();
loadList();
loadHistory();
</script>

</body>
</html>
